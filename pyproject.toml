[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
ignore = [
    # Kept specifically for LeetCode legacy typing parity:
     "UP006", # Allow List[T], Dict[K, V], etc.
     "UP035", # Allow importing List, Dict, Tuple from typing
     "UP045", # Allow Optional[T] instead of T | None
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
typeCheckingMode = "off"
