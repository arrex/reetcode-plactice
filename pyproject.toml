[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
ignore = [
    "C405",
    "E741",
    "PERF402",
    "RUF015",
    "SIM211",
    "UP045",
    "UP006",
    "UP035",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
typeCheckingMode = "off"
